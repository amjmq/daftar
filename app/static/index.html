<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دفتر جلسه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;700&family=Vazirmatn:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="wordmark" href="#/">دفتر</a>
      <nav>
        <a href="#/" data-page="calendar">تقویم</a>
        <a href="#/meetings" data-page="meetings">جلسه‌ها</a>
        <a href="#/tasks" data-page="tasks">وظایف</a>
      </nav>
      <div class="top-actions">
      <a class="btn primary new-btn" href="#/new" data-page="new" aria-label="ایجاد جلسه"><span>ایجاد جلسه</span></a>
      <button class="rec-btn" id="rec-start" type="button" aria-label="ضبط جلسه"><i></i><span>ضبط جلسه</span></button>
      <a class="gear" href="#/settings" data-page="settings" aria-label="تنظیمات" title="تنظیمات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
      </div>
    </div>
    <div id="uploading" class="uploading" hidden>
      <div class="uploading-inner"><span></span><b></b></div>
      <div class="bar"><i></i></div>
    </div>
    <div id="recorder" class="recorder" hidden></div>
  </header>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
